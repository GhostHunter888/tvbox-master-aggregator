name: TVBox Master 纯净全量聚合自动更新

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行主聚合清洗脚本
        run: python3 update.py

      - name: 提交并推送至 GitHub 与 Gitee
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config user.email "bot@tvbox.local"
          git config user.name "TVBox Bot"
          git add -A
          git diff --cached --quiet && echo "无变更，跳过提交" && exit 0
          git commit -m "auto update: $(date -u '+%Y-%m-%d %H:%M:%S')"

          # 推送到 GitHub
          git push origin HEAD:main || git push origin HEAD:master

          # 同步推送到 Gitee
          if [ -n "$GITEE_TOKEN" ]; then
            git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/onm-hundred-and-eleven/tvbox-master-aggregator.git 2>/dev/null || true
            git push gitee HEAD:main --force 2>/dev/null || echo "Gitee 推送跳过"
          fi

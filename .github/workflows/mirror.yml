name: 自动同步上游

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 保存工作流
        run: |
          mkdir -p /tmp/workflows
          cp -r .github/workflows /tmp/workflows/

      - name: 获取上游
        run: |
          git clone --depth 1 https://github.com/haygcao/tvbox-master-aggregator.git /tmp/upstream

      - name: 同步上游文件
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/upstream/ ./

      - name: 恢复工作流
        run: |
          mkdir -p .github
          rm -rf .github/workflows
          cp -r /tmp/workflows/workflows .github/workflows

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "没有新的更新"
            exit 0
          fi

          git commit -m "sync: update from upstream"
          git push origin HEAD:${GITHUB_REF_NAME}


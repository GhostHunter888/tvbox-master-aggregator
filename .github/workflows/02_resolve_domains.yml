name: 02_定时深层播放域名与海报图片 CDN 扒取 (静默定时)

on:
  schedule:
    - cron: '0 0 */3 * *'  # 每 3 天物理深度探测一次 M3U8/TS/302 播放域名与海报图片 CDN
  workflow_dispatch:       # 支持手动随时触发

permissions:
  contents: write

jobs:
  resolve_domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖 (含 tldextract)
        run: pip install -r requirements.txt

      - name: 深度克隆上游参考仓库至本地 repos/ 磁盘目录
        run: |
          mkdir -p repos
          git clone --depth 1 https://github.com/jie20091116/cat.git repos/cat || true
          git clone --depth 1 https://github.com/FongMi/CatVodSpider.git repos/CatVodSpider || true
          git clone --depth 1 https://github.com/gaotianliuyun/gao.git repos/gaotianliuyun || true
          git clone --depth 1 https://github.com/laoma2053/awesome-zhuiju-free.git repos/laoma2053 || true

      - name: 运行 02 号深解析与海报图片 CDN 扒取任务
        env:
          PYTHONUNBUFFERED: "1"
          FORCE_CDN_RESOLVE: "1"
        run: |
          python3 -c "import sys, os, json; sys.path.append('scripts'); from scripts.merge_sources import merge_sources; from scripts.resolve_deep_cdn import resolve_deep_media_domains; from scripts.extract_image_domains import extract_all_poster_image_domains; sites = merge_sources(); g_doms = resolve_deep_media_domains(sites, max_sites=len(sites)); img_doms = extract_all_poster_image_domains(sites, max_sites=len(sites)); open('grouped_cdn_domains.json', 'w').write(json.dumps(g_doms, default=list, ensure_ascii=False, indent=2)); open('dynamic_image_domains.json', 'w').write(json.dumps(img_doms, ensure_ascii=False, indent=2))"

      - name: 自动 Push 深解析出来的 CDN 与海报放行规则
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add grouped_cdn_domains.json dynamic_image_domains.json || true
          git diff --cached --quiet && echo "域名缓存无变更，跳过提交" && exit 0
          git commit -m "auto: 深度探测播放域名与海报图片 CDN [$(date -u '+%Y-%m-%d %H:%M:%S')]"
          git pull --rebase origin main || true
          git push origin HEAD:main --force
